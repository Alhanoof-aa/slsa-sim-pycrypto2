name: Build and Attest
on:
push:
tags:
- "v*"
permissions:
id-token: write
attestations: write
contents: read
jobs:
build-and-attest:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.10"
- name: Build package
run: |
pip install build
python -m build
- name: Generate SLSA Attestation
uses: actions/attest-build-provenance@v1
with:
subject-path: "dist/*.tar.gz"
